repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff-check
        args:
          [
            --fix,
            --line-length=88,
            --select=E4,
            --select=E7,
            --select=E9,
            --select=F,
            --select=I,
            --exclude=*.ipynb,
          ]
      - id: ruff-format
        args: [--line-length=88]
