[project]
name = "battery-charging"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.2",
    "pulp>=3.2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.5",
    "pre-commit>=4.3.0",
    "ruff>=0.12.10",
]

[tool.ruff]
fix = true
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
exclude = ["*.ipynb"]
